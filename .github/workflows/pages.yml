name: Deploy web build to GitHub Pages

# Builds the same YandexGamesWeb preset the store archive uses and publishes it
# as a playable page. Run it by hand from any branch (workflow_dispatch) or let a
# push to the default branch redeploy.
#
# Before the first run, enable Pages: Settings → Pages → Source: GitHub Actions.
# On a private repository Pages needs a paid GitHub plan; on a public one it is free.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a run in progress finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The templates are 1.3 GB; cache them so only the first run pays for it.
      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot-bin "$HOME/.local/share/godot/export_templates"
          curl -fsSL -o /tmp/godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -fsSL -o /tmp/templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"

      - name: Import project
        run: ~/godot-bin/godot --headless --path godot --import

      # Catches a broken build before it reaches a public URL.
      - name: Smoke test
        run: ~/godot-bin/godot --headless --path godot res://tools/smoke_scene.tscn

      - name: Export web build
        run: |
          set -euo pipefail
          mkdir -p godot/export/web
          ~/godot-bin/godot --headless --path godot \
            --export-release "YandexGamesWeb" export/web/index.html
          test -f godot/export/web/index.html
          # Pages runs Jekyll by default, which would skip files it does not like.
          touch godot/export/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: godot/export/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
